# Web tier (Nginx on EC2 / Auto Scaling Group behind the PUBLIC ALB).
# Serves the static storefront and reverse-proxies /api + /uploads to the INTERNAL App-tier ALB.
# Browser -> one origin  =>  no CORS configuration required anywhere.
server {
    listen 80 default_server;
    server_name _;

    root /var/www/apex-noir;            # contents of frontend/public
    index index.html;
    client_max_body_size 80m;           # multi-image uploads (10 x 8 MB)

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz { access_log off; return 200 'ok'; }

    location /api/ {
        proxy_pass http://INTERNAL_APP_ALB_DNS_NAME;     # e.g. internal-apex-app-1234.eu-west-1.elb.amazonaws.com
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }
    location /uploads/ {
        proxy_pass http://INTERNAL_APP_ALB_DNS_NAME;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location ~* \.(css|js|svg|png|jpg|webp)$ { expires 1h; try_files $uri =404; }
    location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
